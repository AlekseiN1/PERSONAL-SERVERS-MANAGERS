<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Servers Manager{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.4rem; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #ddd; padding: .4rem .6rem; text-align: left; font-size: .9rem; }
    th { background: #f5f5f5; }
    .form-row { display: flex; gap: .8rem; align-items: end; flex-wrap: wrap; margin: 1rem 0; }
    label { display: block; font-size: .8rem; color: #555; }
    input[type=text] { padding: .35rem; }
    button { padding: .45rem .9rem; cursor: pointer; }
    .ok { color: #137333; } .err { color: #c5221f; }
    .muted { color: #777; font-size: .85rem; }
    .badge { font-size: .7rem; padding: .1rem .4rem; border-radius: .3rem; background: #eee; }
    .toggle { cursor: pointer; user-select: none; color: #1a73e8; width: 1rem; display: inline-block; }
    tr.stack-row td { background: #fafafa; }
    tr.stack-row .stack-cell { padding-left: 2.2rem; }
    .chips { display: flex; flex-wrap: wrap; gap: .4rem; margin: .5rem 0; }
    .chip { font-size: .8rem; padding: .2rem .55rem; border: 1px solid #cfcfcf; border-radius: 1rem;
            background: #fff; cursor: pointer; }
    .chip:hover { background: #eef3fe; border-color: #1a73e8; }
  </style>
</head>
<body>
  <h1>🖥️ Personal Servers Manager</h1>
  {% block content %}{% endblock %}
</body>
</html>
