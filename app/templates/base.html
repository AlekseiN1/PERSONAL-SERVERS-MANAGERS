<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Servers Manager{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <link rel="stylesheet" href="/static/style.css?v={{ static_version() }}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <p class="brand">🖥️ Personal Servers Manager</p>
      <nav class="tabs">
        <a href="/" {% if request.url.path == "/" %}aria-current="page"{% endif %}>Env update</a>
        <a href="/compare" {% if request.url.path == "/compare" %}aria-current="page"{% endif %}>Compare &amp; sync</a>
        <a href="/backups" {% if request.url.path == "/backups" %}aria-current="page"{% endif %}>Backup</a>
        <a href="/images" {% if request.url.path == "/images" %}aria-current="page"{% endif %}>Images</a>
        <a href="/logs" {% if request.url.path == "/logs" %}aria-current="page"{% endif %}>Logs</a>
      </nav>
    </div>
  </header>
  <main class="container{% if request.url.path == '/logs' %} wide{% endif %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
